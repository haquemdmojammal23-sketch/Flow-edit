<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Pro Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .editor-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 844px;
            background-color: #121824;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        /* Top Navigation */
        .top-nav {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121824;
            z-index: 10;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .close-btn {
            color: white;
            text-decoration: none;
            font-size: 20px;
            cursor: pointer;
        }
        .search-btn {
            font-size: 18px;
            cursor: pointer;
        }
        .quality-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .export-btn {
            background: #0ea5e9;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        /* Preview Area */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .preview-area video, .preview-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .upload-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 5;
            text-align: center;
            padding: 20px;
        }
        .upload-btn-label {
            background: #0ea5e9;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        /* Sub-Actions above timeline (Mute, AI clipper, Cover) */
        .sub-actions-bar {
            background: #121824;
            padding: 8px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .action-chip {
            background: #1e293b;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .action-chip.new-tag::after {
            content: "New";
            background: #f97316;
            color: white;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 4px;
        }

        /* Timeline Area */
        .timeline-area {
            background: #0b0f19;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .timeline-ruler {
            font-size: 10px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }
        .timeline-tracks-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 110px;
            overflow-y: auto;
        }
        .video-track {
            background: #1e293b;
            height: 44px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 6px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .clip-thumb {
            width: 36px;
            height: 32px;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
        }
        .audio-text-track {
            background: #1a2234;
            height: 26px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            color: #94a3b8;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        
        /* Bottom Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            overflow-x: auto;
        }
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #94a3b8;
            cursor: pointer;
            min-width: 48px;
        }
        .tool-item span {
            font-size: 18px;
        }
        .tool-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="nav-left">
                <a href="index.html" class="close-btn">✕</a>
                <span class="search-btn">🔍</span>
            </div>
            <div class="quality-badge">AI UHD ▼</div>
            <button class="export-btn" onclick="alert('Video Exporting Process Started!')">Export</button>
        </div>

        <!-- Video Preview Area -->
        <div class="preview-area">
            <div class="upload-overlay" id="uploadOverlay">
                <label for="videoUpload" class="upload-btn-label">📁 Select Video from Gallery</label>
                <div style="font-size: 12px; color: #94a3b8;">Choose MP4, MOV or WebM video file</div>
            </div>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <video id="videoPlayer" controls style="display: none;"></video>
        </div>

        <!-- Sub Actions Bar (Mute, AI Clipper, Cover) -->
        <div class="sub-actions-bar">
            <div class="action-chip" onclick="alert('Audio Muted')">🔇 Mute clip</div>
            <div class="action-chip new-tag" onclick="alert('AI Clipper Active')">✨ AI clipper</div>
            <div class="action-chip" onclick="alert('Cover settings')">🖼️ Cover</div>
        </div>

        <!-- Timeline Area -->
        <div class="timeline-area">
            <div class="timeline-ruler">
                <span>00:00 / <span id="totalDuration">00:13</span></span>
                <span>⚡ Multi-Track Timeline</span>
            </div>
            <div class="timeline-tracks-container">
                <!-- Video Main Track -->
                <div class="video-track" id="videoTrackContainer">
                    <div class="clip-thumb" id="clipThumb" style="background-image: url('https://picsum.photos/100/100?random=10');"></div>
                    <span id="clipNameText" style="font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">No Video Selected</span>
                </div>
                <!-- Audio Track -->
                <div class="audio-text-track" onclick="alert('Add audio panel opened')">
                    + Add audio
                </div>
                <!-- Text Track -->
                <div class="audio-text-track" onclick="alert('Add text panel opened')">
                    + Add text
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar (Matching CapCut Layout) -->
        <div class="toolbar">
            <div class="tool-item" onclick="alert('Split tool active')"><span>✂️</span>Edit</div>
            <div class="tool-item" onclick="alert('Audio mixer active')"><span>🎵</span>Audio</div>
            <div class="tool-item" onclick="alert('Text editor active')"><span>💬</span>Text</div>
            <div class="tool-item" onclick="alert('Effects panel active')"><span>✨</span>Effects</div>
            <div class="tool-item" onclick="alert('Overlay panel active')"><span>🖼️</span>Overlay</div>
            <div class="tool-item" onclick="alert('Captions generator active')"><span>📝</span>Captions</div>
            <div class="tool-item" onclick="alert('Filters panel active')"><span>🎨</span>Filter</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const clipNameText = document.getElementById('clipNameText');
        const totalDuration = document.getElementById('totalDuration');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                uploadOverlay.style.display = 'none';
                clipNameText.textContent = file.name;

                videoPlayer.onloadedmetadata = function() {
                    const mins = Math.floor(videoPlayer.duration / 60);
                    const secs = Math.floor(videoPlayer.duration % 60);
                    totalDuration.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                };

                videoPlayer.play();
            }
        }
    </script>
</body>
</html>
