<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Pro Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .editor-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 844px;
            background-color: #121822;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        /* Top Header Bar */
        .top-nav {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121822;
            flex-shrink: 0;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .close-btn, .search-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }
        .quality-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .export-btn {
            background: #22d3ee;
            color: #0f172a;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* Video Preview Area */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000000;
            margin: 4px 12px;
            border-radius: 6px;
            overflow: hidden;
            min-height: 180px;
            max-height: 240px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .preview-area video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .upload-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 5;
            text-align: center;
            padding: 10px;
        }
        .upload-btn-label {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Tool Settings Panel (Overlay without pushing toolbar) */
        .tool-panel {
            background: #1e293b;
            padding: 10px 14px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            position: absolute;
            bottom: 55px;
            left: 0;
            width: 100%;
            z-index: 20;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: #38bdf8;
        }
        .panel-close {
            cursor: pointer;
            font-size: 14px;
            color: #94a3b8;
        }
        .panel-options {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
        }
        .panel-btn {
            background: #0f172a;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        .panel-slider {
            width: 100%;
            accent-color: #38bdf8;
        }
        .text-input-box {
            width: 100%;
            padding: 6px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 5px;
            font-size: 12px;
        }

        /* Quick Options Bar */
        .quick-options-bar {
            background: #121822;
            padding: 4px 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .quick-chip {
            background: #1e293b;
            color: #cbd5e1;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Timeline Section */
        .timeline-section {
            background: #0d121b;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .timeline-ruler {
            font-size: 9px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
        }
        .timeline-tracks-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 110px;
            overflow-y: auto;
        }
        .main-video-track {
            background: #1e293b;
            height: 34px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 0 5px;
            gap: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .track-thumb {
            width: 26px;
            height: 26px;
            background: #334155;
            border-radius: 3px;
            background-size: cover;
            background-position: center;
        }
        .sub-track-row {
            background: #161e2e;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 10px;
            color: #94a3b8;
            border: 1px dashed rgba(255,255,255,0.1);
            cursor: pointer;
        }

        /* Bottom Toolbar (Always Fixed at Bottom) */
        .toolbar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 8px 2px;
            border-top: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
            z-index: 25;
        }
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            color: #94a3b8;
            cursor: pointer;
            min-width: 40px;
        }
        .tool-item span {
            font-size: 16px;
        }
        .tool-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <div class="nav-left">
                <a href="index.html" class="close-btn">✕</a>
                <span class="search-btn">🔍</span>
            </div>
            <div class="quality-badge">AI UHD ▼</div>
            <button class="export-btn" onclick="alert('Video exported successfully!')">Export</button>
        </div>

        <!-- Video Preview Area -->
        <div class="preview-area">
            <div class="upload-overlay" id="uploadOverlay">
                <label for="videoUpload" class="upload-btn-label">📁 Select Video from Gallery</label>
                <div style="font-size: 10px; color: #94a3b8;">Choose MP4, MOV or WebM file</div>
            </div>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <video id="videoPlayer" controls style="display: none;"></video>
        </div>

        <!-- Tool Control Panel (Positioned as Overlay) -->
        <div class="tool-panel" id="toolPanel">
            <div class="panel-header">
                <span id="panelTitle">Tool Settings</span>
                <span class="panel-close" onclick="closePanel()">✕</span>
            </div>
            <div class="panel-options" id="panelOptions"></div>
        </div>

        <!-- Quick Options Bar -->
        <div class="quick-options-bar">
            <div class="quick-chip" onclick="toggleMute()">🔇 <span id="muteText">Mute clip</span></div>
            <div class="quick-chip" onclick="alert('AI Clipper active')">✨ AI clipper</div>
            <div class="quick-chip" onclick="alert('Cover settings')">🖼️ Cover</div>
        </div>

        <!-- Timeline Section -->
        <div class="timeline-section">
            <div class="timeline-ruler">
                <span>00:00</span>
                <span>00:01</span>
                <span>00:02</span>
                <span>00:03</span>
                <span id="durationLabel" style="color: #38bdf8;">00:11</span>
            </div>
            <div class="timeline-tracks-box" id="tracksContainer">
                <div class="main-video-track" id="mainVideoTrack">
                    <div class="track-thumb" id="trackThumb"></div>
                    <span id="clipName" style="font-size: 10px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;">No Video Selected</span>
                </div>
                <div class="sub-track-row" onclick="document.getElementById('audioUpload').click()">
                    + Add audio <input type="file" id="audioUpload" accept="audio/*" style="display: none;" onchange="loadAudio(event)">
                </div>
                <div class="sub-track-row" onclick="openTool('text')">
                    + Add text
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar (Fixed) -->
        <div class="toolbar">
            <div class="tool-item" onclick="openTool('edit')"><span>✂️</span>Split</div>
            <div class="tool-item" onclick="openTool('volume')"><span>🔊</span>Volume</div>
            <div class="tool-item" onclick="openTool('duplicate')"><span>📑</span>Duplicate</div>
            <div class="tool-item" onclick="openTool('speed')"><span>⚡</span>Speed</div>
            <div class="tool-item" onclick="openTool('delete')" style="color: #f87171;"><span>🗑️</span>Delete</div>
            <div class="tool-item" onclick="openTool('filter')"><span>🎨</span>Filter</div>
            <div class="tool-item" onclick="openTool('text')"><span>💬</span>Text</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const clipName = document.getElementById('clipName');
        const durationLabel = document.getElementById('durationLabel');
        const trackThumb = document.getElementById('trackThumb');
        const toolPanel = document.getElementById('toolPanel');
        const panelTitle = document.getElementById('panelTitle');
        const panelOptions = document.getElementById('panelOptions');
        const tracksContainer = document.getElementById('tracksContainer');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                uploadOverlay.style.display = 'none';
                clipName.textContent = file.name;
                trackThumb.style.backgroundImage = `url('https://picsum.photos/100/100?random=${Math.random()}')`;

                videoPlayer.onloadedmetadata = function() {
                    const mins = Math.floor(videoPlayer.duration / 60);
                    const secs = Math.floor(videoPlayer.duration % 60);
                    durationLabel.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                };
                videoPlayer.play();
            }
        }

        function loadAudio(event) {
            const file = event.target.files[0];
            if (file) {
                const audioRow = document.createElement('div');
                audioRow.className = 'sub-track-row';
                audioRow.style.color = '#38bdf8';
                audioRow.textContent = '🎵 Audio: ' + file.name;
                tracksContainer.appendChild(audioRow);
                alert('Audio file added successfully to timeline!');
            }
        }

        function toggleMute() {
            videoPlayer.muted = !videoPlayer.muted;
            document.getElementById('muteText').textContent = videoPlayer.muted ? 'Unmute' : 'Mute clip';
        }

        function openTool(toolType) {
            toolPanel.style.display = 'flex';
            panelOptions.innerHTML = '';

            if (toolType === 'edit') {
                panelTitle.textContent = '✂️ Split & Trim Tool';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Video split successfully at current time!')">Split</button>
                    <button class="panel-btn" onclick="alert('Trim start applied!')">Trim Start</button>
                `;
            } else if (toolType === 'volume') {
                panelTitle.textContent = '🔊 Volume Control (1% - 500%)';
                panelOptions.innerHTML = `
                    <input type="range" class="panel-slider" min="0" max="5" step="0.1" value="1" oninput="setVolume(this.value)">
                `;
            } else if (toolType === 'duplicate') {
                panelTitle.textContent = '📑 Duplicate Clip';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="duplicateClip()">+ Add Duplicate to Timeline</button>
                `;
            } else if (toolType === 'speed') {
                panelTitle.textContent = '⚡ Video Speed Control';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="setSpeed(0.5)">0.5x</button>
                    <button class="panel-btn" onclick="setSpeed(1.0)">1.0x</button>
                    <button class="panel-btn" onclick="setSpeed(2.0)">2.0x</button>
                    <button class="panel-btn" onclick="setSpeed(5.0)">5.0x</button>
                `;
            } else if (toolType === 'text') {
                panelTitle.textContent = '💬 Text Overlay & Keyboard Input';
                panelOptions.innerHTML = `
                    <input type="text" class="text-input-box" placeholder="Type your text here..." oninput="addTextOverlay(this.value)">
                `;
            } else if (toolType === 'filter') {
                panelTitle.textContent = '🎨 Color Filters';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="applyFilter('none')">Normal</button>
                    <button class="panel-btn" onclick="applyFilter('grayscale(100%)')">B & W</button>
                    <button class="panel-btn" onclick="applyFilter('sepia(100%)')">Sepia</button>
                    <button class="panel-btn" onclick="applyFilter('contrast(180%)')">Contrast</button>
                `;
            } else if (toolType === 'delete') {
                if(confirm('Delete this clip?')) {
                    videoPlayer.src = '';
                    videoPlayer.style.display = 'none';
                    uploadOverlay.style.display = 'flex';
                    clipName.textContent = 'No Video Selected';
                    trackThumb.style.backgroundImage = 'none';
                    toolPanel.style.display = 'none';
                }
            }
        }

        function closePanel() {
            toolPanel.style.display = 'none';
        }

        function setVolume(val) {
            videoPlayer.volume = Math.min(val, 1.0);
            alert('Volume set to ' + Math.round(val * 100) + '%');
        }

        function setSpeed(rate) {
            videoPlayer.playbackRate = rate;
            alert('Speed set to ' + rate + 'x');
        }

        function applyFilter(style) {
            videoPlayer.style.filter = style;
            alert('Filter applied!');
        }

        function duplicateClip() {
            const newTrack = document.createElement('div');
            newTrack.className = 'main-video-track';
            newTrack.innerHTML = `<div class="track-thumb" style="background-image:${trackThumb.style.backgroundImage}"></div><span style="font-size:10px; color:#fff;">Duplicated Clip</span>`;
            tracksContainer.appendChild(newTrack);
            alert('Clip duplicated and added to timeline!');
        }

        function addTextOverlay(text) {
            if(text.trim() !== '') {
                console.log('Text active: ' + text);
            }
        }
    </script>
</body>
</html>
