<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Pro Video & Photo Editor Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .editor-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 844px;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* Top Navigation bar */
        .editor-top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #121212;
            border-bottom: 1px solid #222;
        }
        .back-btn, .export-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .export-btn {
            background: #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
        }
        .project-title-top {
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }
        /* Video Preview Screen */
        .preview-screen {
            flex: 1;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .video-player-mock {
            width: 90%;
            height: 80%;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600') center/cover;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-overlay-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        /* Timeline and Audio Waveform Section */
        .timeline-section {
            background: #121212;
            padding: 15px;
            border-top: 1px solid #222;
        }
        .timeline-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: #94a3b8;
        }
        .timeline-tracks-box {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }
        .track-row {
            height: 28px;
            background: #2a2a2a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            position: relative;
            overflow: hidden;
        }
        .video-clip-block {
            background: #3b82f6;
            height: 20px;
            border-radius: 3px;
            width: 70%;
            display: flex;
            align-items: center;
            padding-left: 6px;
            font-size: 10px;
            font-weight: 600;
        }
        .audio-clip-block {
            background: #06b6d4;
            height: 20px;
            border-radius: 3px;
            width: 85%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 4px;
        }
        .tiny-wave {
            width: 2px;
            height: 12px;
            background: white;
            border-radius: 1px;
        }
        /* Editing Tools Toolbar */
        .editing-toolbar {
            background: #18181b;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #27272a;
        }
        .tool-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 10px;
            cursor: pointer;
        }
        .tool-icon-btn span:first-child {
            font-size: 18px;
        }
        .tool-icon-btn.active {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="editor-container">
        <!-- Top Navigation -->
        <div class="editor-top-nav">
            <button class="back-btn" onclick="window.location.href='index.html'">✕</button>
            <div class="project-title-top">Dhaka Vlog.mp4</div>
            <button class="export-btn">Export</button>
        </div>

        <!-- Video Preview -->
        <div class="preview-screen">
            <div class="video-player-mock">
                <div class="play-overlay-btn">▶</div>
            </div>
        </div>

        <!-- Timeline & Waveform Section -->
        <div class="timeline-section">
            <div class="timeline-controls">
                <span>00:04 / 02:30</span>
                <span>⚡ Multi-Track Timeline</span>
            </div>
            <div class="timeline-tracks-box">
                <!-- Video Track -->
                <div class="track-row">
                    <div class="video-clip-block">🎬 Clip_01.mp4</div>
                </div>
                <!-- Audio Waveform Track -->
                <div class="track-row">
                    <div class="audio-clip-block">
                        <div class="tiny-wave"></div>
                        <div class="tiny-wave" style="height: 16px;"></div>
                        <div class="tiny-wave" style="height: 8px;"></div>
                        <div class="tiny-wave" style="height: 14px;"></div>
                        <div class="tiny-wave" style="height: 18px;"></div>
                        <div class="tiny-wave" style="height: 10px;"></div>
                        <div class="tiny-wave" style="height: 15px;"></div>
                        <div class="tiny-wave" style="height: 6px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Editing Toolbar -->
        <div class="editing-toolbar">
            <button class="tool-icon-btn active">
                <span>✂️</span>
                <span>Split</span>
            </button>
            <button class="tool-icon-btn">
                <span>⚡</span>
                <span>Speed</span>
            </button>
            <button class="tool-icon-btn">
                <span>🎨</span>
                <span>Filters</span>
            </button>
            <button class="tool-icon-btn">
                <span>💬</span>
                <span>Text</span>
            </button>
            <button class="tool-icon-btn">
                <span>🎵</span>
                <span>Audio</span>
            </button>
            <button class="tool-icon-btn">
                <span>✨</span>
                <span>AI Tools</span>
            </button>
        </div>
    </div>

</body>
</html>
