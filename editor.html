<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Pro Video & Photo Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .editor-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 844px;
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .top-nav {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            z-index: 10;
        }
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .preview-area video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .upload-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 5;
        }
        .upload-btn-label {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .timeline-area {
            background: #111827;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .time-info {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .track {
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .clip-box {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }
        .waveform {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .waveform-inner {
            width: 70%;
            height: 100%;
            background: #38bdf8;
            border-radius: 3px;
        }
        .toolbar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 15px 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
        }
        .tool-item span {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Back</a>
            <div style="font-weight: 600; font-size: 15px;">FlowEdit Studio</div>
            <div style="font-size: 13px; color: #38bdf8; cursor: pointer;" onclick="document.getElementById('videoUpload').click()">Upload</div>
        </div>

        <!-- Video Preview Area -->
        <div class="preview-area">
            <div class="upload-overlay" id="uploadOverlay">
                <label for="videoUpload" class="upload-btn-label">📁 Select Video from Gallery</label>
                <div style="font-size: 12px; color: #94a3b8;">Choose MP4, MOV or WebM file</div>
            </div>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <video id="videoPlayer" controls style="display: none;"></video>
        </div>

        <!-- Timeline Area -->
        <div class="timeline-area">
            <div class="time-info">
                <span id="currentTime">00:00 / 00:00</span>
                <span style="color: #38bdf8;">⚡ Multi-Track Timeline</span>
            </div>
            <div class="track">
                <div class="clip-box" id="clipName">No Video Selected</div>
                <div class="waveform">
                    <div class="waveform-inner"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar -->
        <div class="toolbar">
            <div class="tool-item"><span>✂️</span>Split</div>
            <div class="tool-item"><span>⚡</span>Speed</div>
            <div class="tool-item"><span>🎨</span>Filters</div>
            <div class="tool-item"><span>💬</span>Text</div>
            <div class="tool-item"><span>🎵</span>Audio</div>
            <div class="tool-item"><span>✨</span>AI Tools</div>
        </div>
    </div>

    <script>
        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoPlayer = document.getElementById('videoPlayer');
                const uploadOverlay = document.getElementById('uploadOverlay');
                const clipName = document.getElementById('clipName');

                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                uploadOverlay.style.display = 'none';
                clipName.textContent = file.name;

                videoPlayer.play();
            }
        }
    </script>
</body>
</html>
