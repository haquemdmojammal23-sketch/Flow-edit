<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Pro Video & Photo Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .editor-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 844px;
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .top-nav {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            z-index: 10;
        }
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .preview-area video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .upload-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 5;
        }
        .upload-btn-label {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        /* Dynamic Tool Panel */
        .tool-panel {
            background: #1e293b;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none;
            flex-direction: column;
            gap: 10px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-close {
            cursor: pointer;
            font-size: 16px;
            color: #94a3b8;
        }
        .panel-options {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .panel-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .panel-btn:hover {
            background: #475569;
        }
        .panel-btn.active {
            background: #6366f1;
        }

        .timeline-area {
            background: #111827;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .time-info {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .track {
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow-x: auto;
        }
        .clip-box {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .waveform {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            min-width: 100px;
        }
        .waveform-inner {
            width: 100%;
            height: 100%;
            background: #38bdf8;
            border-radius: 3px;
        }
        .toolbar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 15px 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
        }
        .tool-item:hover, .tool-item.active {
            color: #38bdf8;
        }
        .tool-item span {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Back</a>
            <div style="font-weight: 600; font-size: 15px;">FlowEdit Studio</div>
            <div style="font-size: 13px; color: #38bdf8; cursor: pointer;" onclick="document.getElementById('videoUpload').click()">+ Add Media</div>
        </div>

        <!-- Video Preview Area -->
        <div class="preview-area">
            <div class="upload-overlay" id="uploadOverlay">
                <label for="videoUpload" class="upload-btn-label">📁 Select Video from Gallery</label>
                <div style="font-size: 12px; color: #94a3b8;">Choose MP4, MOV or WebM file</div>
            </div>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <video id="videoPlayer" controls style="display: none;"></video>
        </div>

        <!-- Dynamic Tool Settings Panel -->
        <div class="tool-panel" id="toolPanel">
            <div class="panel-title">
                <span id="panelTitleText">Tool Settings</span>
                <span class="panel-close" onclick="closeToolPanel()">✕</span>
            </div>
            <div class="panel-options" id="panelOptions">
                <!-- Program options will load here dynamically -->
            </div>
        </div>

        <!-- Timeline Area -->
        <div class="timeline-area">
            <div class="time-info">
                <span id="currentTime">00:00 / 00:00</span>
                <span style="color: #38bdf8;">⚡ Multi-Track Timeline</span>
            </div>
            <div class="track" id="timelineTrack">
                <div class="clip-box" id="clipName">No Video Selected</div>
                <div class="waveform">
                    <div class="waveform-inner"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar -->
        <div class="toolbar">
            <div class="tool-item" onclick="openTool('split')"><span>✂️</span>Split</div>
            <div class="tool-item" onclick="openTool('speed')"><span>⚡</span>Speed</div>
            <div class="tool-item" onclick="openTool('filters')"><span>🎨</span>Filters</div>
            <div class="tool-item" onclick="openTool('text')"><span>💬</span>Text</div>
            <div class="tool-item" onclick="openTool('audio')"><span>🎵</span>Audio</div>
            <div class="tool-item" onclick="openTool('ai')"><span>✨</span>AI Tools</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const clipName = document.getElementById('clipName');
        const timeDisplay = document.getElementById('currentTime');
        const toolPanel = document.getElementById('toolPanel');
        const panelTitleText = document.getElementById('panelTitleText');
        const panelOptions = document.getElementById('panelOptions');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                uploadOverlay.style.display = 'none';
                clipName.textContent = file.name;

                videoPlayer.onloadedmetadata = function() {
                    const duration = formatTime(videoPlayer.duration);
                    timeDisplay.textContent = `00:00 / ${duration}`;
                };

                videoPlayer.play();
            }
        }

        videoPlayer.ontimeupdate = function() {
            if (!isNaN(videoPlayer.duration)) {
                const current = formatTime(videoPlayer.currentTime);
                const duration = formatTime(videoPlayer.duration);
                timeDisplay.textContent = `${current} / ${duration}`;
            }
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Tool Programs Setup
        function openTool(toolName) {
            toolPanel.style.display = 'flex';
            panelOptions.innerHTML = '';

            if (toolName === 'split') {
                panelTitleText.textContent = '✂️ Video Splitter Program';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Split at current playhead position executed!')">Split Clip</button>
                    <button class="panel-btn" onclick="alert('Trim start point applied!')">Trim Start</button>
                    <button class="panel-btn" onclick="alert('Trim end point applied!')">Trim End</button>
                `;
            } else if (toolName === 'speed') {
                panelTitleText.textContent = '⚡ Speed Control Program';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="setSpeed(0.5)">0.5x (Slow)</button>
                    <button class="panel-btn active" onclick="setSpeed(1.0)">1.0x (Normal)</button>
                    <button class="panel-btn" onclick="setSpeed(1.5)">1.5x</button>
                    <button class="panel-btn" onclick="setSpeed(2.0)">2.0x (Fast)</button>
                `;
            } else if (toolName === 'filters') {
                panelTitleText.textContent = '🎨 Color Filters Program';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="applyFilter('none')">Normal</button>
                    <button class="panel-btn" onclick="applyFilter('grayscale(100%)')">B & W</button>
                    <button class="panel-btn" onclick="applyFilter('sepia(100%)')">Cinematic Sepia</button>
                    <button class="panel-btn" onclick="applyFilter('contrast(150%)')">High Contrast</button>
                `;
            } else if (toolName === 'text') {
                panelTitleText.textContent = '💬 Text Overlay Program';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Title text layer added!')">+ Add Title</button>
                    <button class="panel-btn" onclick="alert('Subtitle template applied!')">+ Subtitle</button>
                `;
            } else if (toolName === 'audio') {
                panelTitleText.textContent = '🎵 Audio & Extract Program';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Audio extracted from video successfully!')">Extract Audio</button>
                    <button class="panel-btn" onclick="alert('Muted video track!')">Mute Audio</button>
                    <button class="panel-btn" onclick="alert('Background music added!')">+ Add BGM</button>
                `;
            } else if (toolName === 'ai') {
                panelTitleText.textContent = '✨ AI Enhancement Tools';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('AI Auto Captions generated!')">Auto Captions</button>
                    <button class="panel-btn" onclick="alert('AI Voice Enhancement active!')">Voice Enhance</button>
                    <button class="panel-btn" onclick="alert('AI Background Removal active!')">BG Removal</button>
                `;
            }
        }

        function closeToolPanel() {
            toolPanel.style.display = 'none';
        }

        function setSpeed(rate) {
            videoPlayer.playbackRate = rate;
            alert('Playback speed set to ' + rate + 'x');
        }

        function applyFilter(filterStyle) {
            videoPlayer.style.filter = filterStyle;
        }
    </script>
</body>
</html>
