<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - CapCut Style Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .editor-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 844px;
            background-color: #121822;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        /* Top Header Bar */
        .top-nav {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121822;
            z-index: 10;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .close-btn, .search-btn {
            color: white;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
        }
        .quality-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .export-btn {
            background: #22d3ee;
            color: #0f172a;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* Video Preview Area (CapCut Box Style) */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000000;
            margin: 0 12px;
            border-radius: 8px;
            overflow: hidden;
            max-height: 360px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .preview-area video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .upload-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 5;
            text-align: center;
            padding: 20px;
        }
        .upload-btn-label {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        /* Middle Quick Options (Mute, AI Clipper, Cover) */
        .quick-options-bar {
            background: #121822;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .quick-chip {
            background: #1e293b;
            color: #cbd5e1;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .quick-chip.new-badge::after {
            content: "New";
            background: #f97316;
            color: white;
            font-size: 7px;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: 3px;
        }

        /* Timeline Area (Exact CapCut Layout) */
        .timeline-section {
            background: #0d121b;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .timeline-ruler {
            font-size: 10px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }
        .timeline-tracks-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 120px;
            overflow-y: auto;
        }
        .main-video-track {
            background: #1e293b;
            height: 44px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            position: relative;
        }
        .track-thumb {
            width: 36px;
            height: 34px;
            background: #334155;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
        }
        .sub-track-row {
            background: #161e2e;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            color: #94a3b8;
            border: 1px dashed rgba(255,255,255,0.1);
            cursor: pointer;
        }

        /* Dynamic Tool Settings Panel */
        .tool-panel {
            background: #1e293b;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #38bdf8;
        }
        .panel-close {
            cursor: pointer;
            font-size: 14px;
            color: #94a3b8;
        }
        .panel-options {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .panel-btn {
            background: #0f172a;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        .panel-btn:hover {
            background: #0ea5e9;
        }

        /* Bottom Toolbar (CapCut Style Icons) */
        .toolbar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 10px 4px;
            border-top: 1px solid rgba(255,255,255,0.08);
            overflow-x: auto;
        }
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: #94a3b8;
            cursor: pointer;
            min-width: 45px;
        }
        .tool-item span {
            font-size: 18px;
        }
        .tool-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <div class="nav-left">
                <a href="index.html" class="close-btn">✕</a>
                <span class="search-btn">🔍</span>
            </div>
            <div class="quality-badge">AI UHD ▼</div>
            <button class="export-btn" onclick="alert('Video exported successfully in AI UHD quality!')">Export</button>
        </div>

        <!-- Video Preview Area -->
        <div class="preview-area">
            <div class="upload-overlay" id="uploadOverlay">
                <label for="videoUpload" class="upload-btn-label">📁 Select Video from Gallery</label>
                <div style="font-size: 11px; color: #94a3b8;">Choose MP4, MOV or WebM file</div>
            </div>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <video id="videoPlayer" controls style="display: none;"></video>
        </div>

        <!-- Tool Control Panel (Interactive) -->
        <div class="tool-panel" id="toolPanel">
            <div class="panel-header">
                <span id="panelTitle">Tool Settings</span>
                <span class="panel-close" onclick="closePanel()">✕</span>
            </div>
            <div class="panel-options" id="panelOptions"></div>
        </div>

        <!-- Quick Options Bar (Mute, AI Clipper, Cover) -->
        <div class="quick-options-bar">
            <div class="quick-chip" onclick="toggleMute()">🔇 <span id="muteText">Mute clip</span></div>
            <div class="quick-chip new-badge" onclick="alert('AI Clipper active')">✨ AI clipper</div>
            <div class="quick-chip" onclick="alert('Cover settings opened')">🖼️ Cover</div>
        </div>

        <!-- Timeline Section -->
        <div class="timeline-section">
            <div class="timeline-ruler">
                <span>00:00</span>
                <span>00:01</span>
                <span>00:02</span>
                <span>00:03</span>
                <span id="durationLabel" style="color: #38bdf8;">00:11</span>
            </div>
            <div class="timeline-tracks-box">
                <!-- Main Video Track -->
                <div class="main-video-track">
                    <div class="track-thumb" id="trackThumb"></div>
                    <span id="clipName" style="font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;">No Video Selected</span>
                </div>
                <!-- Add Audio Track -->
                <div class="sub-track-row" onclick="openTool('audio')">
                    + Add audio
                </div>
                <!-- Add Text Track -->
                <div class="sub-track-row" onclick="openTool('text')">
                    + Add text
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar (CapCut Style) -->
        <div class="toolbar">
            <div class="tool-item" onclick="openTool('edit')"><span>✂️</span>Split</div>
            <div class="tool-item" onclick="openTool('volume')"><span>🔊</span>Volume</div>
            <div class="tool-item" onclick="openTool('animations')"><span>✨</span>Animations</div>
            <div class="tool-item" onclick="openTool('effects')"><span>🪄</span>Effects</div>
            <div class="tool-item" onclick="openTool('delete')" style="color: #f87171;"><span>🗑️</span>Delete</div>
            <div class="tool-item" onclick="openTool('speed')"><span>⚡</span>Speed</div>
            <div class="tool-item" onclick="openTool('filter')"><span>🎨</span>Filter</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const clipName = document.getElementById('clipName');
        const durationLabel = document.getElementById('durationLabel');
        const trackThumb = document.getElementById('trackThumb');
        const toolPanel = document.getElementById('toolPanel');
        const panelTitle = document.getElementById('panelTitle');
        const panelOptions = document.getElementById('panelOptions');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                uploadOverlay.style.display = 'none';
                clipName.textContent = file.name;
                trackThumb.style.backgroundImage = `url('https://picsum.photos/100/100?random=${Math.random()}')`;

                videoPlayer.onloadedmetadata = function() {
                    const mins = Math.floor(videoPlayer.duration / 60);
                    const secs = Math.floor(videoPlayer.duration % 60);
                    durationLabel.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                };
                videoPlayer.play();
            }
        }

        function toggleMute() {
            videoPlayer.muted = !videoPlayer.muted;
            document.getElementById('muteText').textContent = videoPlayer.muted ? 'Unmute' : 'Mute clip';
        }

        function openTool(toolType) {
            toolPanel.style.display = 'flex';
            panelOptions.innerHTML = '';

            if (toolType === 'edit') {
                panelTitle.textContent = '✂️ Split & Trim Tool';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Split executed at current timeline position!')">Split Clip</button>
                    <button class="panel-btn" onclick="alert('Trim start applied!')">Trim Start</button>
                `;
            } else if (toolType === 'volume') {
                panelTitle.textContent = '🔊 Volume Control';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="setVolume(0)">Mute (0%)</button>
                    <button class="panel-btn" onclick="setVolume(0.5)">Medium (50%)</button>
                    <button class="panel-btn" onclick="setVolume(1.0)">Full (100% - Normal)</button>
                    <button class="panel-btn" onclick="setVolume(2.0)">Boost (200%)</button>
                `;
            } else if (toolType === 'speed') {
                panelTitle.textContent = '⚡ Video Speed Control';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="setSpeed(0.5)">0.5x Slow</button>
                    <button class="panel-btn" onclick="setSpeed(1.0)">1.0x Normal</button>
                    <button class="panel-btn" onclick="setSpeed(2.0)">2.0x Fast</button>
                `;
            } else if (toolType === 'audio') {
                panelTitle.textContent = '🎵 Audio & Extract Program';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Audio extracted from video track successfully!')">Extract Audio</button>
                    <button class="panel-btn" onclick="alert('Background music added to timeline!')">Add BGM</button>
                `;
            } else if (toolType === 'text') {
                panelTitle.textContent = '💬 Text & Captions Tool';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Text layer added to video!')">Add Text</button>
                    <button class="panel-btn" onclick="alert('AI Auto Captions generated!')">Auto Captions</button>
                `;
            } else if (toolType === 'filter') {
                panelTitle.textContent = '🎨 Color Filters';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="applyFilter('none')">Normal</button>
                    <button class="panel-btn" onclick="applyFilter('grayscale(100%)')">B & W</button>
                    <button class="panel-btn" onclick="applyFilter('sepia(100%)')">Cinematic</button>
                `;
            } else if (toolType === 'delete') {
                if(confirm('Are you sure you want to delete this clip?')) {
                    videoPlayer.src = '';
                    videoPlayer.style.display = 'none';
                    uploadOverlay.style.display = 'flex';
                    clipName.textContent = 'No Video Selected';
                    trackThumb.style.backgroundImage = 'none';
                    toolPanel.style.display = 'none';
                }
            } else {
                panelTitle.textContent = '✨ Effects & Animations';
                panelOptions.innerHTML = `
                    <button class="panel-btn" onclick="alert('Animation effect applied!')">Fade In/Out</button>
                    <button class="panel-btn" onclick="alert('Glow effect applied!')">Glow FX</button>
                `;
            }
        }

        function closePanel() {
            toolPanel.style.display = 'none';
        }

        function setVolume(level) {
            videoPlayer.volume = level;
            alert('Volume set to ' + (level * 100) + '%');
        }

        function setSpeed(rate) {
            videoPlayer.playbackRate = rate;
            alert('Speed set to ' + rate + 'x');
        }

        function applyFilter(style) {
            videoPlayer.style.filter = style;
            alert('Filter applied successfully!');
        }
    </script>
</body>
</html>
