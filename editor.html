<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Pro Video Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .editor-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 844px;
            background-color: #121824;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }
        /* Top Navigation */
        .top-nav {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121824;
            z-index: 10;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .close-btn, .search-icon {
            color: white;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
        }
        .quality-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .export-btn {
            background: #0ea5e9;
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        /* Preview Area */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .preview-area video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .upload-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 5;
            text-align: center;
            padding: 20px;
        }
        .upload-btn-label {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        /* Sub Actions Bar */
        .sub-actions-bar {
            background: #121824;
            padding: 8px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            overflow-x: auto;
        }
        .action-chip {
            background: #1e293b;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .action-chip:hover {
            background: #334155;
        }

        /* Interactive Tool Panel (Opens on clicking tools) */
        .tool-control-panel {
            background: #1e293b;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
        }
        .panel-close {
            cursor: pointer;
            font-size: 16px;
            color: #94a3b8;
        }
        .panel-body {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .panel-option-btn {
            background: #0f172a;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .panel-option-btn:hover {
            background: #0ea5e9;
        }

        /* Timeline Area */
        .timeline-area {
            background: #0b0f19;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .timeline-ruler {
            font-size: 10px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }
        .timeline-tracks {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 100px;
            overflow-y: auto;
        }
        .video-track {
            background: #1e293b;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .sub-track {
            background: #151c2c;
            height: 26px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            color: #94a3b8;
            border: 1px dashed rgba(255,255,255,0.1);
            cursor: pointer;
        }

        /* Bottom Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 12px 5px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #94a3b8;
            cursor: pointer;
        }
        .tool-item span {
            font-size: 18px;
        }
        .tool-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="nav-left">
                <a href="index.html" class="close-btn">✕</a>
                <span class="search-icon">🔍</span>
            </div>
            <div class="quality-badge">AI UHD ▼</div>
            <button class="export-btn" onclick="exportVideo()">Export</button>
        </div>

        <!-- Video Preview Area -->
        <div class="preview-area">
            <div class="upload-overlay" id="uploadOverlay">
                <label for="videoUpload" class="upload-btn-label">📁 Select Video from Gallery</label>
                <div style="font-size: 12px; color: #94a3b8;">Choose MP4, MOV or WebM video file</div>
            </div>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <video id="videoPlayer" controls style="display: none;"></video>
        </div>

        <!-- Tool Control Panel (Interactive) -->
        <div class="tool-control-panel" id="toolControlPanel">
            <div class="panel-header">
                <span id="panelTitle">Tool Settings</span>
                <span class="panel-close" onclick="closePanel()">✕</span>
            </div>
            <div class="panel-body" id="panelBody">
                <!-- Dynamic options loaded here -->
            </div>
        </div>

        <!-- Sub Actions Bar -->
        <div class="sub-actions-bar">
            <div class="action-chip" onclick="toggleMute()">🔇 <span id="muteText">Mute clip</span></div>
            <div class="action-chip" onclick="alert('AI Clipper auto-trimming activated!')">✨ AI clipper</div>
            <div class="action-chip" onclick="alert('Cover template editor opened')">🖼️ Cover</div>
        </div>

        <!-- Timeline Area -->
        <div class="timeline-area">
            <div class="timeline-ruler">
                <span id="timeCounter">00:00 / 00:00</span>
                <span>⚡ Multi-Track Timeline</span>
            </div>
            <div class="timeline-tracks">
                <div class="video-track">
                    <div style="width: 30px; height: 28px; background: #0ea5e9; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px;">▶</div>
                    <span id="clipName" style="font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;">No Video Selected</span>
                </div>
                <div class="sub-track" onclick="openTool('audio')">+ Add audio / Extract Audio</div>
                <div class="sub-track" onclick="openTool('text')">+ Add text / Captions</div>
            </div>
        </div>

        <!-- Bottom Toolbar -->
        <div class="toolbar">
            <div class="tool-item" onclick="openTool('edit')"><span>✂️</span>Edit</div>
            <div class="tool-item" onclick="openTool('audio')"><span>🎵</span>Audio</div>
            <div class="tool-item" onclick="openTool('text')"><span>💬</span>Text</div>
            <div class="tool-item" onclick="openTool('effects')"><span>✨</span>Effects</div>
            <div class="tool-item" onclick="openTool('overlay')"><span>🖼️</span>Overlay</div>
            <div class="tool-item" onclick="openTool('captions')"><span>📝</span>Captions</div>
            <div class="tool-item" onclick="openTool('filter')"><span>🎨</span>Filter</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const clipName = document.getElementById('clipName');
        const timeCounter = document.getElementById('timeCounter');
        const toolPanel = document.getElementById('toolControlPanel');
        const panelTitle = document.getElementById('panelTitle');
        const panelBody = document.getElementById('panelBody');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                uploadOverlay.style.display = 'none';
                clipName.textContent = file.name;

                videoPlayer.onloadedmetadata = function() {
                    timeCounter.textContent = `00:00 / ${formatTime(videoPlayer.duration)}`;
                };
                videoPlayer.play();
            }
        }

        videoPlayer.ontimeupdate = function() {
            if (!isNaN(videoPlayer.duration)) {
                timeCounter.textContent = `${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;
            }
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleMute() {
            videoPlayer.muted = !videoPlayer.muted;
            document.getElementById('muteText').textContent = videoPlayer.muted ? 'Unmute' : 'Mute clip';
        }

        function openTool(toolType) {
            toolPanel.style.display = 'flex';
            panelBody.innerHTML = '';

            if (toolType === 'edit') {
                panelTitle.textContent = '✂️ Edit & Split Tools';
                panelBody.innerHTML = `
                    <button class="panel-option-btn" onclick="alert('Clip split at current playhead!')">Split</button>
                    <button class="panel-option-btn" onclick="setSpeed(0.5)">Slow (0.5x)</button>
                    <button class="panel-option-btn" onclick="setSpeed(1.0)">Normal (1.0x)</button>
                    <button class="panel-option-btn" onclick="setSpeed(2.0)">Fast (2.0x)</button>
                `;
            } else if (toolType === 'audio') {
                panelTitle.textContent = '🎵 Audio & Extract Program';
                panelBody.innerHTML = `
                    <button class="panel-option-btn" onclick="alert('Audio successfully extracted from video track!')">Extract Audio</button>
                    <button class="panel-option-btn" onclick="alert('Background music track added!')">Add BGM</button>
                `;
            } else if (toolType === 'text' || toolType === 'captions') {
                panelTitle.textContent = '💬 Text & Auto Captions';
                panelBody.innerHTML = `
                    <button class="panel-option-btn" onclick="alert('Text layer added to video!')">Add Text</button>
                    <button class="panel-option-btn" onclick="alert('AI Auto Captions generated successfully!')">Auto Captions</button>
                `;
            } else if (toolType === 'filter') {
                panelTitle.textContent = '🎨 Color Filters';
                panelBody.innerHTML = `
                    <button class="panel-option-btn" onclick="applyFilter('none')">Normal</button>
                    <button class="panel-option-btn" onclick="applyFilter('grayscale(100%)')">B & W</button>
                    <button class="panel-option-btn" onclick="applyFilter('sepia(100%)')">Cinematic</button>
                    <button class="panel-option-btn" onclick="applyFilter('contrast(160%)')">High Contrast</button>
                `;
            } else if (toolType === 'overlay') {
                panelTitle.textContent = '🖼️ Overlay Management';
                panelBody.innerHTML = `
                    <button class="panel-option-btn" onclick="alert('Select image/video for overlay added!')">+ Add Overlay</button>
                `;
            } else {
                panelTitle.textContent = '✨ Effects & Enhancements';
                panelBody.innerHTML = `
                    <button class="panel-option-btn" onclick="alert('Video effect applied!')">Glow Effect</button>
                    <button class="panel-option-btn" onclick="alert('AI background removal active!')">Remove BG</button>
                `;
            }
        }

        function closePanel() {
            toolPanel.style.display = 'none';
        }

        function setSpeed(rate) {
            videoPlayer.playbackRate = rate;
            alert('Playback speed updated to ' + rate + 'x');
        }

        function applyFilter(style) {
            videoPlayer.style.filter = style;
            alert('Filter applied successfully!');
        }

        function exportVideo() {
            alert('Your video project is ready and exporting in AI UHD quality!');
        }
    </script>
</body>
</html>
