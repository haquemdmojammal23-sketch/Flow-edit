<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Pro CapCut Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .editor-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 844px;
            background-color: #121822;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        /* Top Header Bar */
        .top-nav {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121822;
            flex-shrink: 0;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .close-btn, .search-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }
        .quality-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .export-btn {
            background: #22d3ee;
            color: #0f172a;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* Video Preview Area with Live Text & Font Styles */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000000;
            margin: 4px 12px;
            border-radius: 8px;
            overflow: hidden;
            max-height: 250px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .preview-area video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .upload-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 5;
            text-align: center;
            padding: 10px;
        }
        .upload-btn-label {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        /* Live Text Display on Video */
        .live-text-layer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
            display: none;
            text-align: center;
            padding: 6px 16px;
            border-radius: 6px;
            white-space: nowrap;
        }

        /* Preview Control Bar */
        .preview-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 16px;
            background: #121822;
            font-size: 14px;
            color: #94a3b8;
            flex-shrink: 0;
        }

        /* Quick Options Bar */
        .quick-options-bar {
            background: #121822;
            padding: 4px 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .quick-chip {
            background: #1e293b;
            color: #cbd5e1;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Timeline Section */
        .timeline-section {
            background: #0d121b;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .timeline-ruler {
            font-size: 9px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }
        .timeline-tracks-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 85px;
            overflow-y: auto;
        }
        .main-video-track {
            background: #1e293b;
            height: 34px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 8px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .track-thumb {
            width: 26px;
            height: 26px;
            background: #334155;
            border-radius: 3px;
            background-size: cover;
            background-position: center;
        }
        .sub-track-row {
            background: #161e2e;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 10px;
            color: #94a3b8;
            border: 1px dashed rgba(255,255,255,0.15);
            cursor: pointer;
        }

        /* Tool Settings Overlay Panel */
        .tool-panel {
            background: #1e293b;
            padding: 10px 14px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none;
            flex-direction: column;
            gap: 6px;
            position: absolute;
            bottom: 52px;
            left: 0;
            width: 100%;
            z-index: 30;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: #38bdf8;
        }
        .panel-close {
            cursor: pointer;
            font-size: 14px;
            color: #94a3b8;
        }
        .panel-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .panel-row {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
        }
        .panel-btn {
            background: #0f172a;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        .panel-btn.active-style {
            background: #0ea5e9;
            border-color: #38bdf8;
        }
        .panel-slider {
            width: 100%;
            accent-color: #38bdf8;
        }
        .text-input-box {
            width: 100%;
            padding: 6px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 5px;
            font-size: 12px;
        }

        /* Bottom Toolbar (Fixed) */
        .toolbar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 8px 2px;
            border-top: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
            z-index: 40;
        }
        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            color: #94a3b8;
            cursor: pointer;
            min-width: 42px;
        }
        .tool-item span {
            font-size: 17px;
        }
        .tool-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <div class="nav-left">
                <a href="index.html" class="close-btn">✕</a>
                <span class="search-btn">🔍</span>
            </div>
            <div class="quality-badge">AI UHD ▼</div>
            <button class="export-btn" onclick="alert('Video exported successfully!')">Export</button>
        </div>

        <!-- Video Preview Area -->
        <div class="preview-area">
            <div class="upload-overlay" id="uploadOverlay">
                <label for="videoUpload" class="upload-btn-label">📁 Select Video from Gallery</label>
                <div style="font-size: 10px; color: #94a3b8;">Choose MP4, MOV or WebM file</div>
            </div>
            <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <video id="videoPlayer" controls style="display: none;"></video>
            <div class="live-text-layer" id="liveTextLayer"></div>
        </div>

        <!-- Preview Control Bar -->
        <div class="preview-controls">
            <span style="font-size: 11px;">🔍</span>
            <span style="cursor:pointer;" onclick="videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause()">▶</span>
            <div style="display:flex; gap:15px; font-size:13px;">
                <span style="cursor:pointer;" onclick="alert('Undo')">↩</span>
                <span style="cursor:pointer;" onclick="alert('Redo')">↪</span>
            </div>
        </div>

        <!-- Tool Settings Overlay Panel -->
        <div class="tool-panel" id="toolPanel">
            <div class="panel-header">
                <span id="panelTitle">Tool Settings</span>
                <span class="panel-close" onclick="closePanel()">✕</span>
            </div>
            <div class="panel-options" id="panelOptions"></div>
        </div>

        <!-- Quick Options Bar -->
        <div class="quick-options-bar">
            <div class="quick-chip" onclick="toggleMute()">🔇 <span id="muteText">Mute clip</span></div>
            <div class="quick-chip" onclick="alert('AI Clipper active')">✨ AI clipper</div>
            <div class="quick-chip" onclick="alert('Cover settings')">🖼️ Cover</div>
        </div>

        <!-- Timeline Section -->
        <div class="timeline-section">
            <div class="timeline-ruler">
                <span>00:00</span>
                <span>00:01</span>
                <span>00:02</span>
                <span>00:03</span>
                <span id="durationLabel" style="color: #38bdf8;">00:11</span>
            </div>
            <div class="timeline-tracks-box" id="tracksContainer">
                <div class="main-video-track" id="mainVideoTrack">
                    <div class="track-thumb" id="trackThumb"></div>
                    <span id="clipName" style="font-size: 10px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;">No Video Selected</span>
                </div>
                <div class="sub-track-row" onclick="document.getElementById('audioUpload').click()">
                    + Add audio <input type="file" id="audioUpload" accept="audio/*" style="display: none;" onchange="loadAudio(event)">
                </div>
                <div class="sub-track-row" onclick="openTool('text')">
                    + Add text & Lyrics
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar (Fixed) -->
        <div class="toolbar">
            <div class="tool-item" onclick="openTool('edit')"><span>✂️</span>Split</div>
            <div class="tool-item" onclick="openTool('volume')"><span>🔊</span>Volume</div>
            <div class="tool-item" onclick="openTool('duplicate')"><span>📑</span>Duplicate</div>
            <div class="tool-item" onclick="openTool('speed')"><span>⚡</span>Speed</div>
            <div class="tool-item" onclick="openTool('delete')" style="color: #f87171;"><span>🗑️</span>Delete</div>
            <div class="tool-item" onclick="openTool('filter')"><span>🎨</span>Filter</div>
            <div class="tool-item" onclick="openTool('text')"><span>💬</span>Text</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const clipName = document.getElementById('clipName');
        const durationLabel = document.getElementById('durationLabel');
        const trackThumb = document.getElementById('trackThumb');
        const toolPanel = document.getElementById('toolPanel');
        const panelTitle = document.getElementById('panelTitle');
        const panelOptions = document.getElementById('panelOptions');
        const tracksContainer = document.getElementById('tracksContainer');
        const liveTextLayer = document.getElementById('liveTextLayer');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                uploadOverlay.style.display = 'none';
                clipName.textContent = file.name;
                trackThumb.style.backgroundImage = `url('https://picsum.photos/100/100?random=${Math.random()}')`;

                videoPlayer.onloadedmetadata = function() {
                    const mins = Math.floor(videoPlayer.duration / 60);
                    const secs = Math.floor(videoPlayer.duration % 60);
                    durationLabel.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                };
                videoPlayer.play();
            }
        }

        function loadAudio(event) {
            const file = event.target.files[0];
            if (file) {
                const audioRow = document.createElement('div');
                audioRow.className = 'sub-track-row';
                audioRow.style.color = '#38bdf8';
                audioRow.textContent = '🎵 Audio: ' + file.name;
                tracksContainer.appendChild(audioRow);
                alert('অডিও ফাইল সফলভাবে টাইমলাইনে যুক্ত হয়েছে!');
            }
        }

        function toggleMute() {
            videoPlayer.muted = !videoPlayer.muted;
            document.getElementById('muteText').textContent = videoPlayer.muted ? 'Unmute' : 'Mute clip';
        }

        function openTool(toolType) {
            toolPanel.style.display = 'flex';
            panelOptions.innerHTML = '';

            if (toolType === 'edit') {
                panelTitle.textContent = '✂️ Split & Trim Tool';
                panelOptions.innerHTML = `
                    <div class="panel-row">
                        <button class="panel-btn" onclick="alert('সঠিক সময়ে ভিডিও স্প্লিট করা হয়েছে!')">Split</button>
                        <button class="panel-btn" onclick="alert('শুরুর অংশ ট্রিম করা হয়েছে!')">Trim Start</button>
                        <button class="panel-btn" onclick="alert('শেষের অংশ ট্রিম করা হয়েছে!')">Trim End</button>
                    </div>
                `;
            } else if (toolType === 'volume') {
                panelTitle.textContent = '🔊 Volume Control (1% - 500%) [Live No OK]';
                panelOptions.innerHTML = `
                    <div style="display:flex; flex-direction:column; width:100%; gap:4px;">
                        <div style="display:flex; justify-content:space-between; font-size:10px; color:#38bdf8;">
                            <span>1%</span>
                            <span id="volVal">100% (Normal)</span>
                            <span>500% (Boost)</span>
                        </div>
                        <input type="range" class="panel-slider" min="0.01" max="5" step="0.1" value="1" oninput="setLiveVolume(this.value)">
                    </div>
                `;
            } else if (toolType === 'duplicate') {
                panelTitle.textContent = '📑 Duplicate Clip';
                panelOptions.innerHTML = `
                    <div class="panel-row">
                        <button class="panel-btn" onclick="duplicateClip()">+ টাইমলাইনে ডুপ্লিকেট ক্লিপ যোগ করুন</button>
                    </div>
                `;
            } else if (toolType === 'speed') {
                panelTitle.textContent = '⚡ Video Speed Control';
                panelOptions.innerHTML = `
                    <div class="panel-row">
                        <button class="panel-btn" onclick="setSpeed(0.5)">0.5x</button>
                        <button class="panel-btn" onclick="setSpeed(1.0)">1.0x</button>
                        <button class="panel-btn" onclick="setSpeed(2.0)">2.0x</button>
                        <button class="panel-btn" onclick="setSpeed(5.0)">5.0x</button>
                    </div>
                `;
            } else if (toolType === 'text') {
                panelTitle.textContent = '💬 Text, Lyrics & Font Styles (CapCut Style)';
                panelOptions.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
                        <input type="text" class="text-input-box" id="textInputVal" placeholder="টেক্সট বা লিরিকস লিখুন..." oninput="updateLiveText(this.value)">
                        <div style="font-size:10px; color:#38bdf8;">স্টাইলিশ ফন্ট ও কালার সিলেক্ট করুন:</div>
                        <div class="panel-row">
                            <button class="panel-btn" onclick="setFontStyle('sans-serif', '#ffffff', 'none')">Classic White</button>
                            <button class="panel-btn" onclick="setFontStyle('serif', '#facc15', '2px 2px #000')">Yellow Glow</button>
                            <button class="panel-btn" onclick="setFontStyle('monospace', '#38bdf8', '0 0 10px #38bdf8')">Neon Blue</button>
                            <button class="panel-btn" onclick="setFontStyle('cursive', '#f43f5e', '2px 2px 4px #000')">Arabic/Stylish</button>
                        </div>
                    </div>
                `;
            } else if (toolType === 'filter') {
                panelTitle.textContent = '🎨 Color Filters';
                panelOptions.innerHTML = `
                    <div class="panel-row">
                        <button class="panel-btn" onclick="applyFilter('none')">Normal</button>
                        <button class="panel-btn" onclick="applyFilter('grayscale(100%)')">B & W</button>
                        <button class="panel-btn" onclick="applyFilter('sepia(100%)')">Sepia</button>
                        <button class="panel-btn" onclick="applyFilter('contrast(180%)')">Contrast</button>
                    </div>
                `;
            } else if (toolType === 'delete') {
                if(confirm('আপনি কি এই ক্লিপটি মুছে ফেলতে চান?')) {
                    videoPlayer.src = '';
                    videoPlayer.style.display = 'none';
                    uploadOverlay.style.display = 'flex';
                    clipName.textContent = 'No Video Selected';
                    trackThumb.style.backgroundImage = 'none';
                    liveTextLayer.style.display = 'none';
                    toolPanel.style.display = 'none';
                }
            }
        }

        function closePanel() {
            toolPanel.style.display = 'none';
        }

        function setLiveVolume(val) {
            let num = parseFloat(val);
            videoPlayer.volume = Math.min(num, 1.0);
            document.getElementById('volVal').textContent = Math.round(num * 100) + '%';
        }

        function setSpeed(rate) {
            videoPlayer.playbackRate = rate;
            alert('ভিডিওর গতি ' + rate + 'x এ সেট করা হয়েছে');
        }

        function applyFilter(style) {
            videoPlayer.style.filter = style;
            alert('ফিল্টার সফলভাবে প্রয়োগ করা হয়েছে!');
        }

        function duplicateClip() {
            const newTrack = document.createElement('div');
            newTrack.className = 'main-video-track';
            newTrack.innerHTML = `<div class="track-thumb" style="background-image:${trackThumb.style.backgroundImage}"></div><span style="font-size:10px; color:#fff;">ডুপ্লিকেট ক্লিপ</span>`;
            tracksContainer.appendChild(newTrack);
            alert('ক্লিপ সফলভাবে ডুপ্লিকেট করে টাইমলাইনে যুক্ত করা হয়েছে!');
        }

        function updateLiveText(txt) {
            if(txt.trim() !== '') {
                liveTextLayer.textContent = txt;
                liveTextLayer.style.display = 'block';
            } else {
                liveTextLayer.style.display = 'none';
            }
        }

        function setFontStyle(fontFamily, color, shadow) {
            liveTextLayer.style.fontFamily = fontFamily;
            liveTextLayer.style.color = color;
            liveTextLayer.style.textShadow = shadow;
            alert('ফন্ট স্টাইল পরিবর্তন করা হয়েছে!');
        }
    </script>
</body>
</html>
