<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowEdit - Smart Video & Photo Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 844px;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            border-radius: 0px;
        }
        @media (min-width: 401px) {
            .phone-container {
                border-radius: 40px;
                border: 8px solid #1f2937;
            }
        }
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
        }
        .header-icons {
            display: flex;
            gap: 15px;
            color: #94a3b8;
        }
        .header-icons svg {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }
        .section-title {
            padding: 0 20px;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 20px;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .creation-grid {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .create-card {
            padding: 22px;
            border-radius: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .create-card:active {
            transform: scale(0.98);
        }
        .video-card {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
        }
        .photo-card {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .create-card h3 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .mini-timeline {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .mini-track {
            height: 6px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .mini-wave {
            width: 45%;
            height: 100%;
            background: white;
            border-radius: 3px;
        }
        .recent-section {
            padding: 0 20px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 40px;
        }
        .project-card {
            background: #1f2937;
            padding: 16px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s;
        }
        .project-card:hover {
            background: #374151;
        }
        .project-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
        }
        .project-info {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">F</div>
                FlowEdit
            </div>
            <div class="header-icons">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            </div>
        </div>

        <!-- New Creation -->
        <div class="section-title">NEW CREATION</div>
        <div class="creation-grid">
            <!-- New Video Project with Link to editor.html -->
            <a href="editor.html" class="create-card video-card" style="text-decoration: none; color: white; display: block;">
                <h3>NEW VIDEO PROJECT</h3>
                <div class="mini-timeline">
                    <div class="mini-track">
                        <div class="mini-wave"></div>
                    </div>
                    <div class="mini-track">
                        <div class="mini-wave" style="width: 65%;"></div>
                    </div>
                </div>
            </a>
            
            <div class="create-card photo-card">
                <h3>NEW PHOTO PROJECT</h3>
                <div style="font-size: 12px; opacity: 0.85; margin-top: 6px; font-weight: 400;">Advanced Photo Editor & Filters</div>
            </div>
        </div>

        <!-- Recent Projects -->
        <div class="section-title">RECENT PROJECTS</div>
        <div class="recent-section">
            <div class="project-card">
                <div class="project-header">
                    <span>DHAKA VLOG - DRAFT 1</span>
                    <span style="color: #94a3b8; font-size: 12px; font-weight: 400;">2 hours ago</span>
                </div>
                <div class="project-info">1080p • 60fps • 02:45</div>
            </div>
            <div class="project-card">
                <div class="project-header">
                    <span>CINEMATIC REEL EDIT</span>
                    <span style="color: #94a3b8; font-size: 12px; font-weight: 400;">Yesterday</span>
                </div>
                <div class="project-info">4K • 30fps • 00:58</div>
            </div>
        </div>
    </div>
</body>
</html>
